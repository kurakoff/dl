server {
    listen 80;
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API + Auth to backend
    location /api/ {
        proxy_pass http://backend:3001;
        # Dashboard analytics for thousands of sites is throttled to stay within
        # the GSC quota, so a cold load can take a few minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:3001;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Always revalidate index.html so a deploy picks up the new bundle
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
